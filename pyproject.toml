[project]
name = "syurai-procurement"
version = "0.1.0"
description = "Виртуальный тендерный отдел для компании-поставщика"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=45,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "olefile==0.47",
    "openpyxl>=3.1,<4",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "snowballstemmer==3.0.1",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
    "xlrd==2.0.2",
]

[project.scripts]
syurai-eis-sync = "procurement.eis_sync_cli:main"
syurai-eis-backfill = "procurement.eis_backfill_cli:main"
syurai-eis-gaps = "procurement.eis_gaps_cli:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.55,<2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "xlwt==1.3.0",
]
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.0",
]

[build-system]
requires = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Проект и вся документация в коде — на русском. Правила про «неоднозначные»
# кириллические символы дают сотни ложных срабатываний и здесь бесполезны.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# UP042 (StrEnum) требует Python 3.11+ как минимума и меняет поведение
# сериализации pydantic — переход обсуждается отдельно, см. docs/adr.
"src/procurement/domain/*" = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/procurement/domain"]
plugins = ["pydantic.mypy"]
