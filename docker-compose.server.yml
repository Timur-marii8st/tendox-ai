services:
  db:
    image: postgres:16-alpine
    mem_limit: 2g
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement_owner -d procurement"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://procurement_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/procurement
      EIS_PILOT_TOKEN: ${EIS_PILOT_TOKEN:?set EIS_PILOT_TOKEN}
      EIS_GETDOCS_IP_TOKEN: ${EIS_GETDOCS_IP_TOKEN:?set EIS_GETDOCS_IP_TOKEN}
      EIS_PILOT_COMPANY: local-eis-supplier
      EIS_BROWSER_PROXY: socks5://eis-proxy:1080
      EIS_BROWSER_STATE_DIR: /var/lib/eis-browser
      EIS_REJECTED_EVIDENCE_DIR: /var/lib/eis-browser/rejected-evidence
      EIS_DISCOVERY_DB: /var/lib/eis-browser/discovery/eis-discovery.sqlite3
      SUPPLIER_SERP_BROWSER_STATE_DIR: /var/lib/eis-browser/supplier-serp
      SUPPLIER_SERP_CHROME_PATH: ${SUPPLIER_SERP_CHROME_PATH:-/ms-playwright/chromium-1243/chrome-linux64/chrome}
      SUPPLIER_SERP_XVFB_PATH: /usr/bin/Xvfb
    volumes:
      - eis_browser_state:/var/lib/eis-browser
    ports:
      - "127.0.0.1:18000:8000"
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
      eis-proxy:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      PROCUREMENT_API_URL: http://api:8000
      PROCUREMENT_API_TOKEN: ${EIS_PILOT_TOKEN:?set EIS_PILOT_TOKEN}
    ports:
      - "127.0.0.1:13000:3000"
    mem_limit: 768m
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["manual"]
    mem_limit: 2g
    cpus: 2.0
    environment:
      DATABASE_URL: postgresql+psycopg://procurement_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/procurement
      DATABASE_ADMIN_URL: postgresql+psycopg://procurement_owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/procurement
      EIS_GETDOCS_IP_TOKEN: ${EIS_GETDOCS_IP_TOKEN:?set EIS_GETDOCS_IP_TOKEN}
      EIS_BROWSER_PROXY: socks5://eis-proxy:1080
      EIS_BROWSER_STATE_DIR: /var/lib/eis-browser
      EIS_REJECTED_EVIDENCE_DIR: /var/lib/eis-browser/rejected-evidence
    volumes:
      - eis_browser_state:/var/lib/eis-browser
    depends_on:
      db:
        condition: service_healthy
      eis-proxy:
        condition: service_healthy

  eis-proxy:
    build:
      context: .
      dockerfile: Dockerfile.eis-proxy
    volumes:
      - /home/syurai/vibe-seller-state/eis-proxy:/run/eis-proxy:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1080"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
  eis_browser_state:
